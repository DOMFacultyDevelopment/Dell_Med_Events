<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI News Posts Across Campus</title>
<style>
  :root {
    --burnt: #bf5700;        /* UT Austin primary */
    --burnt-dark: #9a4600;
    --ink: #1c1a17;
    --muted: #6b6459;
    --line: #e7e2d8;
    --card: #ffffff;
    --bg: #faf8f4;
    --chip: #f2ede3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 18px;
  }
  .feed-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid var(--burnt);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .feed-header h1 {
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0;
    color: var(--burnt-dark);
    font-weight: 700;
  }
  .feed-header .count { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

  ul.posts { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

  li.post {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--burnt);
    border-radius: 8px;
    padding: 14px 16px;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  li.post:hover { box-shadow: 0 3px 14px rgba(28,26,23,0.10); transform: translateY(-1px); }

  .post a.title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    display: inline-block;
  }
  .post a.title:hover, .post a.title:focus-visible { color: var(--burnt-dark); text-decoration: underline; }
  .post a.title:focus-visible { outline: 2px solid var(--burnt); outline-offset: 2px; border-radius: 2px; }

  .post .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-top: 6px; font-size: 0.78rem; color: var(--muted);
  }
  .post .chip {
    background: var(--chip); color: var(--burnt-dark);
    border-radius: 999px; padding: 2px 9px; font-weight: 600;
    letter-spacing: 0.02em;
  }
  .post .desc { margin: 8px 0 0; font-size: 0.9rem; color: #3a352e; }

  .state { color: var(--muted); font-size: 0.9rem; padding: 24px 4px; text-align: center; }
  .state.error { color: var(--burnt-dark); }

  @media (prefers-reduced-motion: reduce) {
    li.post { transition: none; }
    li.post:hover { transform: none; }
  }
</style>
</head>
<body>
  <header class="feed-header">
    <h1 id="feed-title">AI News Posts Across Campus</h1>
    <span class="count" id="feed-count"></span>
  </header>

  <div id="root" role="region" aria-labelledby="feed-title" aria-live="polite">
    <p class="state">Loading posts…</p>
  </div>

<script>
(function () {
  var DATA_URL = "data/feed-data.json"; // same-origin on GitHub Pages
  var root = document.getElementById("root");
  var countEl = document.getElementById("feed-count");
  var titleEl = document.getElementById("feed-title");

  function fmtDate(iso) {
    var d = new Date(iso.length === 10 ? iso + "T12:00:00Z" : iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function esc(s) {
    var div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  function render(data) {
    var feed = data.feed || {};
    var posts = (data.posts || []).slice();
    if (feed.title) titleEl.textContent = feed.title;

    posts.sort(function (a, b) { return new Date(b.date) - new Date(a.date); });

    if (!posts.length) {
      root.innerHTML = '<p class="state">No posts yet. Check back soon.</p>';
      countEl.textContent = "";
      return;
    }

    countEl.textContent = posts.length + (posts.length === 1 ? " post" : " posts");

    var items = posts.map(function (p) {
      var chip = p.source ? '<span class="chip">' + esc(p.source) + "</span>" : "";
      var desc = p.description ? '<p class="desc">' + esc(p.description) + "</p>" : "";
      return (
        '<li class="post">' +
          '<a class="title" href="' + esc(p.link) + '" target="_blank" rel="noopener">' +
            esc(p.title) +
          "</a>" +
          '<div class="meta">' +
            "<time datetime=\"" + esc(p.date) + "\">" + esc(fmtDate(p.date)) + "</time>" +
            chip +
          "</div>" +
          desc +
        "</li>"
      );
    });

    root.innerHTML = '<ul class="posts">' + items.join("") + "</ul>";
  }

  fetch(DATA_URL, { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      root.innerHTML =
        '<p class="state error">Couldn\'t load the feed (' + esc(err.message) +
        "). Confirm data/feed-data.json is published on GitHub Pages.</p>";
    });
})();
</script>
</body>
</html>
