name: Build RSS feed

on:
  push:
    paths:
      - "data/feed-data.json"
      - "scripts/build_feed.py"
      - ".github/workflows/build-feed.yml"
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC (~7am Central) — keeps lastBuildDate fresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed.xml
        run: python scripts/build_feed.py

      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- feed.xml; then
            echo "No changes to feed.xml."
          else
            git add feed.xml
            git commit -m "chore: rebuild feed.xml [skip ci]"
            git push
          fi
