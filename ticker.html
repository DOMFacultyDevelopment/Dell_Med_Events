<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dell Med Events Ticker</title>
<style>
  /* ── Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --burnt-orange:       #BF5700;
    --burnt-orange-dark:  #8B3D00;
    --burnt-orange-light: #D97230;
    --off-white:          #F5F2ED;   /* matches original ticker background */
    --row-border:         #DDD8D0;
    --text-dark:          #2B2B2B;
    --text-mid:           #555;
    --text-light:         #888;
    --label-w:            110px;
    --row-h:              38px;
    --gap:                56px;
  }

  body {
    background: var(--off-white);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ── Header bar ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--burnt-orange);
    padding: 0 12px;
    height: 26px;
    gap: 10px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .header-left .brand { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .header-divider { color: rgba(255,255,255,0.5); }
  .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.18);
    border: none;
    border-radius: 3px;
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.32); }
  .ctrl-btn.paused { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }

  /* ── Ticker rows ── */
  .ticker-row {
    display: flex;
    align-items: center;
    height: var(--row-h);
    background: var(--off-white);
    border-bottom: 1px solid var(--row-border);
    overflow: hidden;
    position: relative;
  }
  .ticker-row:last-child { border-bottom: none; }

  /* ── Label button — sits on TOP of the scrolling track (z-index) ── */
  .row-label {
    flex-shrink: 0;
    width: var(--label-w);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    position: relative;        /* establishes stacking context */
    z-index: 10;               /* always above the scroll-track (z-index: 1) */
  }
  .row-label .icon { font-size: 13px; }

  /* Color-coded label buttons */
  .label-public   { background: #2E7D32; color: #fff; }   /* green */
  .label-internal { background: #0277BD; color: #fff; }   /* light blue */
  .label-ut       { background: var(--burnt-orange); color: #fff; } /* UT burnt orange */

  /* Fade mask — slides out from behind the label to soften the leading edge */
  .row-mask {
    position: absolute;
    left: var(--label-w);
    top: 0;
    width: 32px;
    height: 100%;
    z-index: 5;               /* above track (1), below label (10) */
    pointer-events: none;
    background: linear-gradient(to right, var(--off-white), transparent);
  }

  /* Scroll track — starts at left:0, scrolls under the label */
  .scroll-track {
    display: flex;
    align-items: center;
    white-space: nowrap;
    position: absolute;
    left: 0;                  /* starts from the very left edge */
    top: 0;
    height: 100%;
    z-index: 1;               /* beneath label (10) and mask (5) */
    will-change: transform;
    padding-left: var(--label-w); /* initial offset so events start after label */
  }

  /* Individual event items — wrapped in <a> for clickability */
  a.event-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 var(--gap) 0 0;
    text-decoration: none;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s;
  }
  a.event-item:hover {
    background: rgba(191, 87, 0, 0.08);
  }
  a.event-item:hover .ev-title {
    color: var(--burnt-orange);
    text-decoration: underline;
  }
  .event-item .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--burnt-orange);
    flex-shrink: 0;
  }
  .event-item .ev-date {
    font-size: 10px;
    font-weight: 700;
    color: var(--burnt-orange);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .event-item .ev-time {
    font-size: 10px;
    color: var(--text-light);
    white-space: nowrap;
  }
  .event-item .ev-title {
    font-size: 12px;
    color: var(--text-dark);
    white-space: nowrap;
  }
  .event-item .ev-loc {
    font-size: 10px;
    color: var(--text-mid);
    white-space: nowrap;
  }
  .event-item .ev-cat {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(191,87,0,0.10);
    color: var(--burnt-orange-dark);
    white-space: nowrap;
  }

  /* Paused state */
  body.paused .scroll-track { animation-play-state: paused !important; }

  /* Loading / error states */
  .event-item.loading .ev-title { color: var(--text-light); font-style: italic; }
  .event-item.error   .ev-title { color: #c0392b; }

  /* ── Animations ── */
  @keyframes scrollLeft {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <span class="brand">Dell Med</span>
    <span class="header-divider">·</span>
    <span>Events Ticker</span>
    <span class="header-divider">·</span>
    <span>Department of Medicine</span>
  </div>
  <div class="header-right">
    <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
    <a href="https://domfacultydevelopment.github.io/Dell_Med_Events/index.html"
       target="_blank" style="text-decoration:none;">
      <button class="ctrl-btn">📅 Calendar</button>
    </a>
  </div>
</div>

<!-- Row: Public -->
<div class="ticker-row" id="row-public">
  <div class="row-label label-public">
    <span class="icon">🌐</span>
    <span>Public</span>
  </div>
  <div class="row-mask"></div>
  <div class="scroll-track" id="track-public">
    <span class="event-item loading">
      <span class="dot"></span>
      <span class="ev-title">Loading public events…</span>
    </span>
  </div>
</div>

<!-- Row: Internal -->
<div class="ticker-row" id="row-internal">
  <div class="row-label label-internal">
    <span class="icon">🔒</span>
    <span>Internal</span>
  </div>
  <div class="row-mask"></div>
  <div class="scroll-track" id="track-internal">
    <span class="event-item loading">
      <span class="dot"></span>
      <span class="ev-title">Loading internal events…</span>
    </span>
  </div>
</div>

<!-- Row: UT Austin -->
<div class="ticker-row" id="row-ut">
  <div class="row-label label-ut">
    <span class="icon">🤘</span>
    <span>UT Austin</span>
  </div>
  <div class="row-mask"></div>
  <div class="scroll-track" id="track-ut">
    <span class="event-item loading">
      <span class="dot"></span>
      <span class="ev-title">Loading UT Austin events…</span>
    </span>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   CONFIG — match the existing ticker's sources
═══════════════════════════════════════════════ */
const SOURCES = {
  public:   { url: 'https://dellmed.utexas.edu/events',           label: 'Public',    track: 'track-public'   },
  internal: { url: 'https://intranet.dellmed.utexas.edu/events',  label: 'Internal',  track: 'track-internal' },
  ut:       { url: 'https://calendar.utexas.edu/?school=austin',  label: 'UT Austin', track: 'track-ut'       },
};

/* ── Pause/Resume ── */
let paused = false;
function togglePause() {
  paused = !paused;
  document.body.classList.toggle('paused', paused);
  const btn = document.getElementById('pauseBtn');
  btn.textContent = paused ? '▶ Resume' : '⏸ Pause';
  btn.classList.toggle('paused', paused);
}

/* ── Date helpers ── */

// Format ISO date string (YYYY-MM-DD) → "Jul 15"
function fmtISODate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// Format RSS pubDate string → "Jul 15"
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function fmtTime(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

// Returns true if ISO date string is today or in the future
function isFutureOrToday(iso) {
  if (!iso) return true;
  const [y, m, d] = iso.split('-').map(Number);
  const evDate = new Date(y, m - 1, d);
  const today  = new Date();
  today.setHours(0, 0, 0, 0);
  return evDate >= today;
}

/* ── Render a track with event items ── */
function renderTrack(trackId, events, speed, fallbackUrl) {
  const track = document.getElementById(trackId);
  if (!events || events.length === 0) {
    track.innerHTML = `<span class="event-item error"><span class="dot"></span><span class="ev-title">No upcoming events</span></span>`;
    return;
  }

  const makeItem = (ev) => {
    const href     = ev.url || fallbackUrl;
    const dateStr  = ev.isoDate ? fmtISODate(ev.isoDate) : ev.date;
    const timeStr  = ev.time || '';
    const locStr   = ev.location ? ` · ${ev.location}` : '';
    return `<a class="event-item" href="${href}" target="_blank" rel="noopener noreferrer" title="${ev.title}${locStr}">
      <span class="dot"></span>
      <span class="ev-date">${dateStr}</span>
      ${timeStr ? `<span class="ev-time">${timeStr}</span>` : ''}
      <span class="ev-title">${ev.title}</span>
      ${ev.location ? `<span class="ev-loc">📍 ${ev.location}</span>` : ''}
      ${ev.speaker  ? `<span class="ev-loc">🎤 ${ev.speaker}</span>`  : ''}
      ${ev.category ? `<span class="ev-cat">${ev.category}</span>` : ''}
    </a>`;
  };

  // Double items for seamless loop
  const html = events.map(makeItem).join('') + events.map(makeItem).join('');
  track.innerHTML = html;

  requestAnimationFrame(() => {
    const labelW   = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--label-w'));
    const contentW = (track.scrollWidth - labelW) / 2;
    const styleId  = `kf-${trackId}`;
    let el = document.getElementById(styleId);
    if (!el) { el = document.createElement('style'); el.id = styleId; document.head.appendChild(el); }
    el.textContent = `
      @keyframes scrollLeft-${trackId} {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-${contentW}px); }
      }
    `;
    track.style.animation = `scrollLeft-${trackId} ${speed}s linear infinite`;
  });
}

/* ── Load internal events from data/events.json ────────────────────────────
   This is the master feed built daily by generate_calendar.py (GitHub Action).
   Schema: { "updated": "...", "events": [ { start, time, title, location, url, source } ] }
   We filter to source="internal" and upcoming dates only.
─────────────────────────────────────────────────────────────────────────── */
async function loadInternalJSON() {
  try {
    const res = await fetch('./data/events.json?ts=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const json = await res.json();
    const all  = json.events || json;
    const today = new Date().toISOString().slice(0, 10);
    return all
      .filter(e => e.source === 'internal' && (e.start || '') >= today)
      .sort((a, b) => (a.start || '').localeCompare(b.start || ''))
      .map(e => ({
        title:    e.title    || '',
        isoDate:  e.start    || '',
        time:     e.time     || '',
        location: e.location || '',
        speaker:  e.speaker  || '',
        category: e.category || '',
        url:      e.url      || SOURCES.internal.url,
      }));
  } catch (_) { return null; }
}

/* ── Fetch events via CORS proxy → RSS/iCal ── */
async function loadFromCalendarPage(sourceKey) {
  const calUrl = 'https://domfacultydevelopment.github.io/Dell_Med_Events/calendar.html';
  try {
    const res = await fetch(calUrl, { mode: 'cors' });
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const jsonMatch = text.match(/window\.__EVENTS__\s*=\s*(\[[\s\S]*?\]);/) ||
                      text.match(/const events\s*=\s*(\[[\s\S]*?\]);/) ||
                      text.match(/var events\s*=\s*(\[[\s\S]*?\]);/);
    if (jsonMatch) {
      const allEvents = JSON.parse(jsonMatch[1]);
      return allEvents.filter(e => (e.source || '').toLowerCase() === sourceKey);
    }
  } catch (e) { /* fall through */ }
  return null;
}

async function loadFromRSS(url) {
  const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url + '/rss')}`;
  try {
    const res  = await fetch(proxyUrl);
    const data = await res.json();
    if (data.status === 'ok' && data.items?.length) {
      return data.items.slice(0, 20).map(item => ({
        title:    item.title,
        date:     fmtDate(item.pubDate),
        time:     fmtTime(item.pubDate),
        category: item.categories?.[0] || '',
        url:      item.link || '',
      }));
    }
  } catch (e) { /* fall through */ }
  return null;
}

// Fallback demo events for public & UT rows only
const DEMO_EVENTS = {
  public: [
    { title: 'Grand Rounds: Cardiology Update',            date: 'Jul 16', time: '12:00 PM', category: 'CME',         url: 'https://dellmed.utexas.edu/events' },
    { title: 'Department of Medicine Town Hall',           date: 'Jul 17', time: '3:00 PM',  category: 'Operations',  url: 'https://dellmed.utexas.edu/events' },
    { title: 'Research Symposium — Translational Science', date: 'Jul 18', time: '9:00 AM',  category: 'Research',    url: 'https://dellmed.utexas.edu/events' },
    { title: 'Clinical Excellence Lecture Series',         date: 'Jul 22', time: '12:00 PM', category: 'CME',         url: 'https://dellmed.utexas.edu/events' },
    { title: 'Minority Health & Health Equity Conference', date: 'Jul 24', time: '8:00 AM',  category: 'CME',         url: 'https://dellmed.utexas.edu/events' },
    { title: 'Patient Safety Symposium',                   date: 'Jul 25', time: '1:00 PM',  category: 'Operations',  url: 'https://dellmed.utexas.edu/events' },
    { title: 'Dell Med Annual Awards Ceremony',            date: 'Aug 1',  time: '5:00 PM',  category: 'Faculty Dev', url: 'https://dellmed.utexas.edu/events' },
  ],
  ut: [
    { title: 'UT Austin: Health & Society Lecture',            date: 'Jul 15', time: '4:00 PM',  category: 'UT Austin', url: 'https://calendar.utexas.edu/?school=austin' },
    { title: 'Texas Today: College of Natural Sciences Forum', date: 'Jul 17', time: '2:00 PM',  category: 'UT Austin', url: 'https://calendar.utexas.edu/?school=austin' },
    { title: 'UT: Graduate Research Showcase',                 date: 'Jul 20', time: '10:00 AM', category: 'UT Austin', url: 'https://calendar.utexas.edu/?school=austin' },
    { title: 'Longhorn Athletics Academic Series',             date: 'Jul 22', time: '6:00 PM',  category: 'UT Austin', url: 'https://calendar.utexas.edu/?school=austin' },
    { title: 'UT Faculty Governance Assembly',                 date: 'Jul 24', time: '3:00 PM',  category: 'UT Austin', url: 'https://calendar.utexas.edu/?school=austin' },
    { title: 'Texas Today: Research & Innovation Summit',      date: 'Jul 29', time: '9:00 AM',  category: 'UT Austin', url: 'https://calendar.utexas.edu/?school=austin' },
  ],
};

/* ── Bootstrap ── */
async function init() {
  // ── Public row ──
  let publicEvents = null;
  try { publicEvents = await loadFromCalendarPage('public'); } catch (_) {}
  if (!publicEvents) {
    try {
      publicEvents = await loadFromRSS('https://dellmed.utexas.edu/events');
    } catch (_) {}
  }
  if (!publicEvents || publicEvents.length === 0) publicEvents = DEMO_EVENTS.public;
  renderTrack('track-public', publicEvents, 90, SOURCES.public.url);

  // ── Internal row — always loads from internal-events.json ──
  let internalEvents = await loadInternalJSON();
  if (!internalEvents || internalEvents.length === 0) {
    // Last-resort fallback: link to intranet events page
    internalEvents = [{
      title:    'Visit the Dell Med Intranet for upcoming internal events',
      date:     '',
      time:     '',
      location: '',
      category: '',
      url:      SOURCES.internal.url,
    }];
  }
  renderTrack('track-internal', internalEvents, 80, SOURCES.internal.url);

  // ── UT Austin row ──
  let utEvents = null;
  try { utEvents = await loadFromCalendarPage('ut'); } catch (_) {}
  if (!utEvents) {
    try {
      utEvents = await loadFromRSS('https://calendar.utexas.edu/?school=austin');
    } catch (_) {}
  }
  if (!utEvents || utEvents.length === 0) utEvents = DEMO_EVENTS.ut;
  renderTrack('track-ut', utEvents, 100, SOURCES.ut.url);
}

init();
</script>
</body>
</html>
