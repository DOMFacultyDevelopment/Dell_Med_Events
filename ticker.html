.bar{background:#e8e8e8;padding:10px 32px;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:13px;}

.sp{flex:1;}

.pbtn:hover{color:#1a1a1a;border-color:#888;}
.callink{color:#444;text-decoration:none;font-size:12px;padding:5px 10px;border:1px solid #c0c0c0;background:#fff;border-radius:3px;}
.callink:hover{color:#1a1a1a;border-color:#888;}
.meta{font-size:11px;color:#6b6b6b;}
.wrap{flex:1;overflow:hidden;position:relative;padding:0 32px;
  mask-image:linear-gradient(to bottom,transparent 0%,#f0f0f0 6%,#f0f0f0 94%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#f0f0f0 6%,#f0f0f0 94%,transparent 100%);}
.track{display:flex;flex-direction:column;will-change:transform;}
.track.paused{animation-play-state:paused!important;}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd);min-height:44px;flex-shrink:0;}
.dbadge{background:var(--or);color:#fff;padding:3px 9px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.3px;white-space:nowrap;flex-shrink:0;}
.item[data-s=internal] .dbadge{background:var(--int);}
.item[data-s=ut] .dbadge{background:var(--ut);}
.sbadge{font-size:9px;padding:2px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.sbadge.public{background:var(--pub);color:#fff;}
.sbadge.internal{background:var(--int);color:#fff;}
.sbadge.ut{background:var(--ut);color:#fff;}
.itime{font-size:11px;color:var(--mu);white-space:nowrap;flex-shrink:0;}
.item a{color:#1a1a1a;text-decoration:none;font-size:14px;line-height:1.3;}
.item a:hover{text-decoration:underline;color:#bf5700;}
@keyframes scroll-up{0%{transform:translateY(0);}100%{transform:translateY(-50%);}}
footer{padding:10px 32px;border-top:1px solid var(--bd);background:#e4e4e4;font-size:11px;color:var(--mu);text-align:center;}
footer a{color:#5f5f5f;}footer a:hover{color:#1a1a1a;}
@media(max-width:640px){header,.bar,.wrap,footer{padding-left:16px;padding-right:16px;}header h1{font-size:17px;}}

var filters={public:true,internal:true,ut:true};
var allEvents=[];

function fmtDate(iso){
  var d=iso&&iso.indexOf('T')>-1?new Date(iso):new Date((iso||'')+'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
function shortDate(iso){
  var d=iso&&iso.indexOf('T')>-1?new Date(iso):new Date((iso||'')+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function fmtTime(ev){
  if(ev.start&&ev.start.indexOf('T')>-1){
    var fmt=function(t){return new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});};
    var s=fmt(ev.start);
    if(ev.end&&ev.end.indexOf('T')>-1&&ev.end!==ev.start)return s+' \u2013 '+fmt(ev.end);
    return s;
  }
  return ev.time||'';
}
function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function filterAndSort(arr,filters){
  var today=new Date().toISOString().slice(0,10);
  return (arr||[])
    .filter(function(e){return (e.start||e.date||'').slice(0,10)>=today;})
    .filter(function(e){return filters[e.source];})
    .sort(function(a,b){return (a.start||a.date||'').localeCompare(b.start||b.date||'');});
}

function build(){
  var track=document.getElementById('track');
  var evs=filterAndSort(allEvents,filters);
  // Dedupe by title
  var seen={};var out=[];
  for(var i=0;i<evs.length;i++){var k=evs[i].title.trim().toLowerCase();if(!seen[k]){seen[k]=1;out.push(evs[i]);}}
  if(!out.length){
    track.innerHTML='<div class="item"><span class="dbadge">--</span><span style="color:#888">No events.</span></div>';
    track.style.animation='none';return;
  }
  var L={public:'Public',internal:'Internal',ut:'UT Austin'};
  var html=out.map(function(e){
    var tm=fmtTime(e);
    return '<div class="item" data-s="'+esc(e.source)+'">'
      +'<span class="dbadge">'+shortDate(e.start||e.date)+'</span>'
      +'<span class="sbadge '+esc(e.source)+'">'+(L[e.source]||esc(e.source))+'</span>'
      +(tm?'<span class="itime">'+esc(tm)+'</span>':'')
      +'<a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.title)+'</a>'
      +'</div>';
  }).join('');
  track.innerHTML=html+html;
  var dur=Math.max(60,Math.round(out.length*44/20));
  track.style.animation='none';
  track.offsetHeight;
  track.style.animation='scroll-up '+dur+'s linear infinite';
}
document.querySelectorAll('.bar input[type=checkbox]').forEach(function(cb){
  cb.addEventListener('change',function(){filters[cb.dataset.filter]=cb.checked;build();});
});
var paused=false;
document.getElementById('pauseBtn').addEventListener('click',function(){
  paused=!paused;
  document.getElementById('track').classList.toggle('paused',paused);
  this.innerHTML=paused?'&#9654; Resume':'&#9646;&#9646; Pause';
});
fetch('data/events.json?ts='+Date.now())
  .then(function(r){if(!r.ok)throw new Error();return r.json();})
  .then(function(d){
    allEvents=d.events||d||[];
    var u=d.updated?new Date(d.updated).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}):'';
    document.getElementById('status').textContent=u?'Updated: '+u:'Live';
    build();
  })
  .catch(function(){
    allEvents=EMBEDDED;
    document.getElementById('status').textContent='Data as of May 2026';
    build();
  });
</script>
</body>
</html>
