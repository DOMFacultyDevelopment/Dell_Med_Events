<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dell Med Events Ticker</title>
<style>
  /* ── Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --burnt-orange:       #BF5700;
    --burnt-orange-dark:  #8B3D00;
    --burnt-orange-light: #D97230;
    --off-white:          #F5F2ED;   /* matches original ticker background */
    --row-border:         #DDD8D0;
    --text-dark:          #2B2B2B;
    --text-mid:           #555;
    --text-light:         #888;
    --label-w:            110px;
    --row-h:              38px;
    --gap:                56px;
  }

  body {
    background: var(--off-white);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ── Header bar ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--burnt-orange);
    padding: 0 12px;
    height: 26px;
    gap: 10px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .header-left .brand { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .header-divider { color: rgba(255,255,255,0.5); }
  .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.18);
    border: none;
    border-radius: 3px;
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.32); }
  .ctrl-btn.paused { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }

  /* ── Ticker rows ── */
  .ticker-row {
    display: flex;
    align-items: center;
    height: var(--row-h);
    background: var(--off-white);
    border-bottom: 1px solid var(--row-border);
    overflow: hidden;
    position: relative;
  }
  .ticker-row:last-child { border-bottom: none; }

  /* ── Label button — sits on TOP of the scrolling track (z-index) ── */
  .row-label {
    flex-shrink: 0;
    width: var(--label-w);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    position: relative;        /* establishes stacking context */
    z-index: 10;               /* always above the scroll-track (z-index: 1) */
  }
  .row-label .icon { font-size: 13px; }

  /* Color-coded label buttons */
  .label-public   { background: #2E7D32; color: #fff; }   /* green */
  .label-internal { background: #0277BD; color: #fff; }   /* light blue */
  .label-ut       { background: var(--burnt-orange); color: #fff; } /* UT burnt orange */

  /* Fade mask — slides out from behind the label to soften the leading edge */
  .row-mask {
    position: absolute;
    left: var(--label-w);
    top: 0;
    width: 32px;
    height: 100%;
    z-index: 5;               /* above track (1), below label (10) */
    pointer-events: none;
    background: linear-gradient(to right, var(--off-white), transparent);
  }

  /* Scroll track — starts at left:0, scrolls under the label */
  .scroll-track {
    display: flex;
    align-items: center;
    white-space: nowrap;
    position: absolute;
    left: 0;                  /* starts from the very left edge */
    top: 0;
    height: 100%;
    z-index: 1;               /* beneath label (10) and mask (5) */
    will-change: transform;
    padding-left: var(--label-w); /* initial offset so events start after label */
  }

  /* Individual event items — wrapped in <a> for clickability */
  a.event-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 var(--gap) 0 0;
    text-decoration: none;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s;
  }
  a.event-item:hover {
    background: rgba(191, 87, 0, 0.08);
  }
  a.event-item:hover .ev-title {
    color: var(--burnt-orange);
    text-decoration: underline;
  }
  .event-item .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--burnt-orange);
    flex-shrink: 0;
  }
  .event-item .ev-date {
    font-size: 10px;
    font-weight: 700;
    color: var(--burnt-orange);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .event-item .ev-time {
    font-size: 10px;
    color: var(--text-light);
    white-space: nowrap;
  }
  .event-item .ev-title {
    font-size: 12px;
    color: var(--text-dark);
    white-space: nowrap;
  }
  .event-item .ev-loc {
    font-size: 10px;
    color: var(--text-mid);
    white-space: nowrap;
  }
  .event-item .ev-cat {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(191,87,0,0.10);
    color: var(--burnt-orange-dark);
    white-space: nowrap;
  }

  /* Paused state */
  body.paused .scroll-track { animation-play-state: paused !important; }

  /* Loading / error states */
  .event-item.loading .ev-title { color: var(--text-light); font-style: italic; }
  .event-item.error   .ev-title { color: #c0392b; }

  /* ── Animations ── */
  @keyframes scrollLeft {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <span class="brand">Dell Med</span>
    <span class="header-divider">·</span>
    <span>Events Ticker</span>
    <span class="header-divider">·</span>
    <span>Department of Medicine</span>
  </div>
  <div class="header-right">
    <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
    <a href="https://domfacultydevelopment.github.io/Dell_Med_Events/index.html"
       target="_blank" style="text-decoration:none;">
      <button class="ctrl-btn">📅 Calendar</button>
    </a>
  </div>
</div>

<!-- Row: Public -->
<div class="ticker-row" id="row-public">
  <div class="row-label label-public">
    <span class="icon">🌐</span>
    <span>Public</span>
  </div>
  <div class="row-mask"></div>
  <div class="scroll-track" id="track-public">
    <span class="event-item loading">
      <span class="dot"></span>
      <span class="ev-title">Loading public events…</span>
    </span>
  </div>
</div>

<!-- Row: Internal -->
<div class="ticker-row" id="row-internal">
  <div class="row-label label-internal">
    <span class="icon">🔒</span>
    <span>Internal</span>
  </div>
  <div class="row-mask"></div>
  <div class="scroll-track" id="track-internal">
    <span class="event-item loading">
      <span class="dot"></span>
      <span class="ev-title">Loading internal events…</span>
    </span>
  </div>
</div>

<!-- Row: UT Austin -->
<div class="ticker-row" id="row-ut">
  <div class="row-label label-ut">
    <span class="icon">🤘</span>
    <span>UT Austin</span>
  </div>
  <div class="row-mask"></div>
  <div class="scroll-track" id="track-ut">
    <span class="event-item loading">
      <span class="dot"></span>
      <span class="ev-title">Loading UT Austin events…</span>
    </span>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════════════════════ */
const SOURCES = {
  public:   { url: 'https://dellmed.utexas.edu/events'          },
  internal: { url: 'https://intranet.dellmed.utexas.edu/events' },
  ut:       { url: 'https://calendar.utexas.edu/?school=austin' },
};

// Pixels-per-second scroll rate — same for all rows so they feel identical.
// Lower = slower, higher = faster.
const PX_PER_SEC = 40;

// data/events.json — the single source of truth, rebuilt daily by GitHub Actions.
const EVENTS_JSON = './data/events.json?ts=' + Date.now();

/* ── Pause/Resume ── */
let paused = false;
function togglePause() {
  paused = !paused;
  document.body.classList.toggle('paused', paused);
  const btn = document.getElementById('pauseBtn');
  btn.textContent = paused ? '▶ Resume' : '⏸ Pause';
  btn.classList.toggle('paused', paused);
}

/* ── Date helpers ── */
function fmtISODate(iso) {
  if (!iso) return '';
  // Parse YYYY-MM-DD or YYYY-MM-DDTHH:MM:SS — take only the date portion
  const datePart = iso.slice(0, 10);
  const [y, m, d] = datePart.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// Today's date as YYYY-MM-DD string in local time (not UTC, avoids timezone drift)
function todayISO() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

/* ── Render a track with event items ── */
function renderTrack(trackId, events, fallbackUrl) {
  const track = document.getElementById(trackId);
  if (!events || events.length === 0) {
    track.innerHTML = `<span class="event-item error"><span class="dot"></span><span class="ev-title">No upcoming events</span></span>`;
    return;
  }

  const makeItem = ev => {
    const href    = ev.url || fallbackUrl;
    const dateStr = fmtISODate(ev.start || ev.date || '');
    const locStr  = ev.location ? ` · ${ev.location}` : '';
    return `<a class="event-item" href="${href}" target="_blank" rel="noopener noreferrer"
               title="${ev.title}${locStr}">
      <span class="dot"></span>
      <span class="ev-date">${dateStr}</span>
      ${ev.time     ? `<span class="ev-time">${ev.time}</span>`         : ''}
      <span class="ev-title">${ev.title}</span>
      ${ev.location ? `<span class="ev-loc">📍 ${ev.location}</span>`  : ''}
    </a>`;
  };

  // Double the items so the loop is seamless
  track.innerHTML = events.map(makeItem).join('') + events.map(makeItem).join('');

  requestAnimationFrame(() => {
    const labelW   = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--label-w'));
    const contentW = (track.scrollWidth - labelW) / 2;
    const duration = contentW / PX_PER_SEC;
    const styleId  = `kf-${trackId}`;
    let el = document.getElementById(styleId);
    if (!el) { el = document.createElement('style'); el.id = styleId; document.head.appendChild(el); }
    el.textContent = `
      @keyframes scrollLeft-${trackId} {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-${contentW}px); }
      }`;
    track.style.animation = `scrollLeft-${trackId} ${duration.toFixed(1)}s linear infinite`;
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   MAIN — load data/events.json once, split by source, filter to today+,
   sort by date, then render each row.
   The GitHub Action rebuilds this file daily at 6am UTC, so yesterday's
   events are automatically gone the next morning.
══════════════════════════════════════════════════════════════════════════ */
async function init() {
  let allEvents = [];
  try {
    const res  = await fetch(EVENTS_JSON);
    if (!res.ok) throw new Error('fetch failed');
    const json = await res.json();
    allEvents  = json.events || json;
  } catch (_) {
    // If the fetch fails, show a fallback message in each row
    ['track-public','track-internal','track-ut'].forEach(id => {
      document.getElementById(id).innerHTML =
        `<span class="event-item error"><span class="dot"></span>` +
        `<span class="ev-title">Could not load events — check data/events.json</span></span>`;
    });
    return;
  }

  // Today's date string for filtering (YYYY-MM-DD, local time)
  const today = todayISO();

  // Helper: filter a source, keep only today-or-future, sort ascending
  function eventsFor(source) {
    return allEvents
      .filter(e => e.source === source && (e.start || e.date || '') >= today)
      .sort((a, b) => (a.start || a.date || '').localeCompare(b.start || b.date || ''));
  }

  const publicEvents   = eventsFor('public');
  const internalEvents = eventsFor('internal');
  const utEvents       = eventsFor('ut');

  renderTrack('track-public',   publicEvents,   SOURCES.public.url);
  renderTrack('track-internal', internalEvents, SOURCES.internal.url);
  renderTrack('track-ut',       utEvents,       SOURCES.ut.url);
}

init();
</script>
</body>
</html>
